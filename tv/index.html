<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GZOWO</title>
<link rel="stylesheet" href="./style.css">
</head>
<body data-screen="boot">

<div id="ambient"></div>
<div id="vignette"></div>

<section id="boot">
  <div class="boot-stage">
    <span class="seed"></span>
    <div class="wordmark" aria-label="GZOWO">
      <span class="glyph"><i class="shaft"></i><b>G</b></span>
      <span class="glyph"><i class="shaft"></i><b>Z</b></span>
      <span class="glyph"><i class="shaft"></i><b>O</b></span>
      <span class="glyph"><i class="shaft"></i><b>W</b></span>
      <span class="glyph"><i class="shaft"></i><b>O</b></span>
    </div>
    <span class="shock"></span>
    <span class="sweep"></span>
    <div class="sub">
      <span class="rule"></span>
      <span class="tagline">Ośrodek Gzowo</span>
    </div>
  </div>
  <div class="boot-grain"></div>
  <div class="boot-flash"></div>
</section>

<section id="profiles" hidden>
  <p class="eyebrow">Kto ogląda?</p>
  <div class="faces" id="faces"></div>
  <aside class="pair-card">
    <img id="qr" alt="" src="/qr.svg">
    <div>
      <p class="eyebrow">Pilot</p>
      <p class="pair-hint">Zeskanuj aparatem</p>
      <p class="pair-small" id="pair-small"></p>
    </div>
  </aside>
</section>

<section id="screensaver" hidden>
  <video id="idle-a" muted playsinline></video>
  <video id="idle-b" muted playsinline></video>
  <div class="idle-clock" id="idle-clock"></div>
</section>

<section id="player" hidden>
  <video id="video" playsinline></video>
  <div id="frame"></div>
  <div class="player-chrome" id="player-chrome">
    <h2 id="player-title"></h2>
    <div class="scrub"><span id="scrub-fill"></span></div>
    <p class="meta"><span id="player-time"></span></p>
  </div>
</section>

<main id="home" hidden>
  <header id="hero">
    <div class="hero-art">
      <img id="hero-backdrop" alt="">
      <div id="hero-trailer"></div>
    </div>
    <div class="hero-copy">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="meta" id="hero-meta"></p>
      <p class="overview" id="hero-overview"></p>
      <div class="actions" id="hero-actions"></div>
    </div>
  </header>
  <div id="rows"></div>
</main>

<section id="detail" hidden>
  <div class="detail-art">
    <img id="detail-backdrop" alt="">
    <div id="detail-trailer"></div>
  </div>
  <div class="detail-body">
    <p class="eyebrow" id="detail-eyebrow"></p>
    <h1 id="detail-title"></h1>
    <p class="meta" id="detail-meta"></p>
    <p class="overview" id="detail-overview"></p>
    <div class="actions" id="detail-actions"></div>
    <div class="actions seasons" id="detail-seasons" hidden></div>
    <div class="cast" id="detail-cast"></div>
  </div>
  <div class="episode-strip" id="detail-episodes" hidden>
    <div class="track track--wide" id="episode-track"></div>
  </div>
</section>

<section id="search" hidden>
  <div class="search-head">
    <p class="eyebrow">Search</p>
    <h1 id="search-query">Type on your phone</h1>
    <p class="meta" id="search-note">The keyboard opens on the remote.</p>
  </div>
  <div class="grid" id="search-results"></div>
</section>

<section id="pairing" hidden>
  <p class="eyebrow">Remote</p>
  <h1>Open this on your phone</h1>
  <p class="pair-url" id="pair-url"></p>
  <p class="meta">Same Wi-Fi. Add it to the home screen once and it behaves like an app.</p>
</section>

<div id="toast" hidden></div>
<div id="offline" hidden>No connection — showing the catalogue from memory</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
