<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GZOWO</title>
<link rel="stylesheet" href="./style.css">
</head>
<body data-screen="boot">

<div id="ambient"></div>
<div id="vignette"></div>

<section id="boot">
  <div class="boot-stage">
    <svg class="kraken" viewBox="0 0 260 250" aria-hidden="true">
      <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path class="ink" pathLength="1" d="M80 100 C70 50 104 26 130 26 C156 26 190 50 180 100"/>
        <path class="ink" pathLength="1" d="M80 100 C94 116 110 122 130 122 C150 122 166 116 180 100"/>
        <path class="ink" pathLength="1" d="M106 84 C110 77 117 77 121 84"/>
        <path class="ink" pathLength="1" d="M139 84 C143 77 150 77 154 84"/>
        <path class="ink" pathLength="1" d="M84 108 C54 128 26 150 24 178 C23 199 48 205 55 189 C59 179 46 172 40 181"/>
        <path class="ink" pathLength="1" d="M99 118 C76 150 52 182 56 208 C59 228 84 229 88 213 C90 203 78 199 73 207"/>
        <path class="ink" pathLength="1" d="M112 123 C102 160 92 192 100 214 C105 227 121 225 119 212"/>
        <path class="ink" pathLength="1" d="M130 124 C130 156 129 180 136 196 C141 206 152 203 150 194"/>
        <path class="ink" pathLength="1" d="M148 123 C160 158 172 190 166 214 C162 229 145 228 147 214"/>
        <path class="ink" pathLength="1" d="M161 118 C182 148 206 178 204 202 C202 221 180 222 179 208 C178 198 190 194 194 203"/>
        <path class="ink" pathLength="1" d="M175 108 C204 126 232 148 236 174 C239 194 218 200 214 186"/>
      </g>
    </svg>
    <span class="seed"></span>
    <div class="wordmark" aria-label="GZOWO">
      <span class="glyph"><i class="shaft"></i><b>G</b></span>
      <span class="glyph"><i class="shaft"></i><b>Z</b></span>
      <span class="glyph"><i class="shaft"></i><b>O</b></span>
      <span class="glyph"><i class="shaft"></i><b>W</b></span>
      <span class="glyph"><i class="shaft"></i><b>O</b></span>
    </div>
    <span class="sweep"></span>
  </div>
  <div class="boot-grain"></div>
  <div class="boot-flash"></div>
</section>

<main id="home" hidden>
  <header id="hero">
    <div class="hero-art">
      <img id="hero-backdrop" alt="">
      <div id="hero-trailer"></div>
    </div>
    <div class="hero-copy">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="meta" id="hero-meta"></p>
      <p class="overview" id="hero-overview"></p>
      <div class="actions" id="hero-actions"></div>
    </div>
  </header>
  <div id="rows"></div>
</main>

<section id="detail" hidden>
  <div class="detail-art">
    <img id="detail-backdrop" alt="">
    <div id="detail-trailer"></div>
  </div>
  <div class="detail-body">
    <p class="eyebrow" id="detail-eyebrow"></p>
    <h1 id="detail-title"></h1>
    <p class="meta" id="detail-meta"></p>
    <p class="overview" id="detail-overview"></p>
    <div class="actions" id="detail-actions"></div>
    <div class="cast" id="detail-cast"></div>
  </div>
</section>

<section id="search" hidden>
  <div class="search-head">
    <p class="eyebrow">Search</p>
    <h1 id="search-query">Type on your phone</h1>
    <p class="meta" id="search-note">The keyboard opens on the remote.</p>
  </div>
  <div class="grid" id="search-results"></div>
</section>

<section id="pairing" hidden>
  <p class="eyebrow">Remote</p>
  <h1>Open this on your phone</h1>
  <p class="pair-url" id="pair-url"></p>
  <p class="meta">Same Wi-Fi. Add it to the home screen once and it behaves like an app.</p>
</section>

<div id="toast" hidden></div>
<div id="offline" hidden>No connection — showing the catalogue from memory</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
